<style>
:root{--navy:#0A1F44;--blue:#1E90FF;--bg:#F3F6FB;--card:#fff;--ink:#14213D;--mute:#5B6784;--line:#E3E9F3;--ok:#16915F;--warn:#B7791F;--bad:#C53030;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#07142E;--card:#0E2147;--ink:#EAF1FF;--mute:#9FB1D6;--line:#1C3566;--ok:#4ADE9B;--warn:#F6C453;--bad:#FF8A8A;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
header{background:var(--navy);color:#fff;padding:14px 0}header .wrap{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:21px;display:flex;align-items:center;gap:9px}.lg{width:36px;height:36px;border-radius:10px;flex:none}.logo b{color:var(--blue)}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 0}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 14px;font:inherit;cursor:pointer}
nav button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
h2{font-size:17px;margin:0 0 8px}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 0}
input,select,textarea{width:100%;margin-top:3px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
button.p,button.s{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;margin-top:10px;margin-inline-end:6px}
button.p{background:var(--blue);color:#fff}button.s{background:var(--navy);color:#fff}button.g{background:var(--ok);color:#fff;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;margin-top:10px}
button.r{background:var(--bad);color:#fff;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;margin-top:10px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.chip{background:#1E90FF22;color:var(--blue);border-radius:10px;padding:2px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.mu{color:var(--mute);font-size:13.5px}.err{color:var(--bad)}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row span:first-child{color:var(--mute)}
.big{font-size:22px;font-weight:800;color:var(--blue)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cards div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}.cards small{display:block;color:var(--mute);font-size:12px}.cards b{font-size:17px}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}td,th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:start}th{color:var(--mute);font-weight:600}
details{margin-top:8px}summary{cursor:pointer;color:var(--blue);font-weight:600}
.box{background:var(--bg);border-radius:12px;padding:10px;margin-top:8px}
.note{font-size:12.5px;color:var(--mute);margin-top:8px}
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:6px 0}.strip img{height:190px;max-width:88%;border-radius:12px;flex:none;scroll-snap-align:start;object-fit:cover}
.pv{display:flex;flex-wrap:wrap;gap:8px}.th{position:relative}.th img{width:84px;height:84px;object-fit:cover;border-radius:10px}.th button{position:absolute;top:-6px;inset-inline-end:-6px;border:0;border-radius:50%;width:22px;height:22px;background:var(--bad);color:#fff;cursor:pointer}
.qrow{display:grid;gap:4px;border-bottom:1px solid var(--line);padding:8px 0}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#toast{position:fixed;bottom:16px;inset-inline:16px;max-width:480px;margin:auto;background:var(--navy);color:#fff;padding:10px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}#toast.bad{background:var(--bad)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

async function shrink(file) {

  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.8));
}

    <details><summary>إفصاحات البائع</summary><div class="box">${(latest[l.id]?.disclosure_items || []).map(i => `<div><b>${E(CATS[i.category] || i.category)}:</b> ${E(i.statement)}</div>`).join('') || 'لا يوجد'}</div></details>
    <label>مركز الفحص<select id="c-${l.id}">${opts}</select></label>
    <button class="p" data-a="quote" data-id="${l.id}">اعرف التكلفة</button><div id="q-${l.id}"></div></section>`).join('');
}

function newV() {
  const qf = a => a.map(([k, l, t]) => t === 't' ? `<label>${l}<input id="a-${k}"></label>` :
    `<div class="qrow"><b style="font-size:14px">${l}</b><select id="a-${k}"><option value="">اختر</option><option>لا</option><option>نعم</option><option>غير متأكد</option></select><input id="x-${k}" placeholder="تفاصيل (اختياري)"></div>`).join('');
  return `<section><h2>الصور</h2><div id="pv" class="pv"></div><label>اختار لحد 8 صور (بتتصغّر تلقائيًا)<input id="ph" type="file" accept="image/*" multiple></label>
    <p class="note">الصور للعرض فقط ومش دليل على حالة السيارة. الفحص هو المرجع.</p></section>
  <section><h2>بيانات السيارة</h2><label>عنوان الإعلان (اختياري، هيتكوّن من الماركة والسنة)<input id="nt"></label>
    <div class="g2"><label>الماركة والموديل<input id="d-make" placeholder="هيونداي النترا"></label><label>سنة الصنع<input id="d-year" type="number" inputmode="numeric"></label>
    <label>اللون<input id="d-color"></label><label>السعر المطلوب (جنيه)<input id="d-price" type="number" inputmode="numeric"></label>
    <label>الوقود<select id="d-fuel"><option value="">-</option><option>بنزين</option><option>ديزل</option><option>غاز</option><option>كهرباء</option><option>هايبرد</option></select></label>
    <label>ناقل الحركة<select id="d-gear"><option value="">-</option><option>أوتوماتيك</option><option>مانوال</option></select></label></div>
    <label>رقم الشاسيه (عشان يتطابق مع تقرير الفحص)<input id="d-chassis" dir="ltr"></label></section>
  <section><h2>حالة السيارة (لازم تجاوب)</h2><p class="note">لو مش متأكد اختار "غير متأكد". الإجابة بتتحفظ نسخة ثابتة والفحص بيتقارن بيها.</p>${qf(Q.filter(q => q[2] === 'y'))}</section>
  <section><h2>الأوراق والمعلومات</h2>${qf(Q.filter(q => q[2] !== 'y'))}<button class="p" data-a="newl">نشر الإعلان</button></section>`;
}

async function reqV(ad) {
  let q = sb.from('inspection_requests').select('*,center:inspection_centers(name),settlements(*),inspection_reports(*,report_findings(*))').order('created_at', {ascending: false});
  if (!ad) q = q.or(`buyer_id.eq.${me.id},seller_id.eq.${me.id}`);
  const {data: R, error} = await q; if (error) throw error;
  const {data: Ls} = await sb.from('listings').select('id,title').in('id', (R || []).map(r => r.listing_id));
  const L = Object.fromEntries((Ls || []).map(l => [l.id, l.title]));
  let items = {}, head = '';
  if (ad) {
    const {data: It} = await sb.from('disclosure_items').select('id,category,statement,snapshot_id').in('snapshot_id', (R || []).map(r => r.disclosure_snapshot_id));
    (It || []).forEach(i => (items[i.snapshot_id] = items[i.snapshot_id] || []).push(i));
    const s = await rpc('finance_summary');
    const c = [['طلبات الفحص', s.requests], ['إجمالي المحصّل', M(s.collected)], ['رسوم المراكز', M(s.center_fees)], ['إيراد المنصة', M(s.revenue)], ['استردادات معلقة', M(s.pending_refunds)], ['تسويات مكتملة', s.settled], ['متنازع عليها', s.disputed], ['ملغاة', s.cancelled]];
    head = `<div class="cards">${c.map(([k, v]) => `<div><small>${k}</small><b>${v}</b></div>`).join('')}</div>`;
  }
  return head + (R?.length ? R.map(r => card(r, L, ad, items)).join('') : '<section>مفيش طلبات لسه.</section>');
}

function card(r, L, ad, items) {
  const s = one(r.settlements), rep = one(r.inspection_reports), mine = r.buyer_id === me.id ? 'buyer' : r.seller_id === me.id ? 'seller' : null, res = s?.calc_result;
  let h = `<section><div class="top"><b>${E(L[r.listing_id] || 'إعلان')}</b><span class="chip">${ST[r.status] || r.status}</span></div>
    <div class="mu">${E(r.center?.name)} · ${M(r.center_fee_listed)}${r.center_discount_bps ? ` (خصم ${r.center_discount_bps / 100}%)` : ''} · ${mine ? 'أنت ' + RES[mine] : 'طلب ' + r.id.slice(0, 8)}</div>`;
  if (mine === 'seller' && !r.seller_accepted_at) h += `<button class="p" data-a="accept" data-id="${r.id}">أوافق وأحوّل مساهمتي (محاكاة)</button>`;
  if (!rep && ['funds_received', 'inspection_scheduled', 'inspection_completed'].includes(r.status) && (mine || ad)) h += `<details><summary>رفع تقرير الفحص</summary><div class="box">
    <label>هوية السيارة (موديل / شاسيه)<input id="vh-${r.id}"></label><label>اسم المركز<input id="cn-${r.id}" value="${E(r.center?.name)}"></label>
    <label>قيود الفحص (اختياري)<input id="lm-${r.id}"></label>
    <label>النتائج: سطر لكل نتيجة. اختياري تبدأ بدرجة: info أو minor أو moderate أو major أو critical ثم | ثم الوصف<textarea id="fd-${r.id}" rows="4" placeholder="major|لحام في الشاسيه الأمامي"></textarea></label>
    <button class="p" data-a="report" data-id="${r.id}">رفع التقرير</button></div></details>`;
  if (rep) {
    h += `<details open><summary>التقرير: ${E(rep.vehicle_identity)} · ${E(rep.center_name)}</summary><div class="box">${(rep.report_findings || []).map(f => `<div>• [${E(f.severity)}] ${E(f.description)}</div>`).join('') || 'لا توجد نتائج مسجلة'}
      ${rep.limitations ? `<div class="mu">القيود: ${E(rep.limitations)}</div>` : ''}
      <div class="mu">${rep.counterpart_response ? 'رد الطرف التاني: ' + (rep.counterpart_response === 'accepted' ? 'قبول' : 'اعتراض: ' + E(rep.response_reason)) : 'مهلة الرد حتى ' + new Date(rep.response_deadline).toLocaleString('ar-EG')}</div></div></details>`;
    if (mine && !rep.counterpart_response && rep.uploaded_by !== me.id)
      h += `<button class="g" data-a="resp" data-v="accepted" data-id="${r.id}">أقبل التقرير</button> <button class="r" data-a="resp" data-v="disputed" data-id="${r.id}">أعترض</button>`;
  }
  if (res) {
    const row = (n, x) => `<tr><td>${n}</td><td>${M(res.paid)}</td><td>${M(x.share)}</td><td>${M(x.commission)}</td><td><b style="color:var(--ok)">${M(x.refund)}</b></td></tr>`;
    h += `<div class="box"><b>${s.approved_at ? 'التسوية' : 'معاينة التسوية'} (سيناريو ${E(s.scenario)}) · المسؤول: ${RES[res.responsible]}</b><div class="mu">${E(res.why)}</div>
      <table><tr><th></th><th>حوّل</th><th>الفحص</th><th>العمولة</th><th>يترد</th></tr>${row('المشتري', res.buyer)}${row('البائع', res.seller)}</table>
      <div class="mu">للمركز ${M(res.center_payout)} · إيراد المنصة ${M(res.platform_revenue)}${res.review ? ' · محتاجة قرار الأدمن' : ''}</div></div>`;
  }
  if (ad) {
    if (s && !s.approved_at && !s.requires_admin_review) h += `<button class="p" data-a="settle" data-v="approve" data-id="${r.id}">اعتماد التسوية</button>`;
    if (s?.approved_at && r.status === 'refund_pending') h += `<button class="g" data-a="settle" data-v="complete" data-id="${r.id}">إتمام الاسترداد (محاكاة)</button>`;
    if (!s?.approved_at && r.status !== 'settled') {
      const id = r.id, fnd = rep?.report_findings || [], its = items[r.disclosure_snapshot_id] || [];
      h += `<details><summary>مراجعة الأدمن</summary><div class="box"><label>النتيجة<select id="o-${id}">${Object.entries(OUT).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
        <label>ملاحظة المراجعة (10 حروف على الأقل)<textarea id="n-${id}" rows="2"></textarea></label>
        <div class="mu" style="margin-top:8px">للمخالفة الجوهرية فقط: لازم ربط بإفصاح وملاحظة ودليل</div>
        <label>بند الإفصاح<select id="it-${id}"><option value="">-</option>${its.map(i => `<option value="${i.id}">${E(CATS[i.category] || i.category)}: ${E(i.statement)}</option>`).join('')}</select></label>
        <label>ملاحظة التقرير<select id="fi-${id}"><option value="">-</option>${fnd.map(f => `<option value="${f.id}">[${E(f.severity)}] ${E(f.description)}</option>`).join('')}</select></label>
        <label>الدليل (مفصول بفاصلة)<input id="ev-${id}"></label><label style="display:flex;gap:8px;align-items:flex-start"><input id="at-${id}" type="checkbox" style="width:auto;margin-top:5px">أؤكد إن العيب لم يُفصح عنه وليس تآكلًا عاديًا</label>
        <div class="mu" style="margin-top:8px">لغير الحاسم أو النزاع أو الإلغاء بعد الفحص: قرار الأدمن</div>
        <label>القرار<select id="dc-${id}"><option value="">معاينة تلقائية</option><option value="buyer">المشتري يتحمل</option><option value="seller">البائع يتحمل</option><option value="split">تقسيم</option></select></label>
        <label>نسبة المشتري % (للتقسيم)<input id="pc-${id}" type="number" min="0" max="100" value="50"></label>
        <button class="s" data-a="review" data-id="${id}">حفظ ومعاينة التسوية</button></div></details>`;
    }
  }
  return h + '</section>';
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, id = b.dataset.id, v = x => byId(x + '-' + id)?.value;
  const H = {
    savecfg: () => {
      const u = $('#cu').value.trim().replace(/\/+$/, ''), k = $('#ck').value.trim();
      if (!/^https:\/\/.+/.test(u)) return toast('اللينك لازم يبدأ بـ https://', 1);
      if (k.length < 20) return toast('المفتاح غير مكتمل', 1);
      if (k.startsWith('sb_secret_')) return toast('ده مفتاح سري. استخدم المفتاح العام (anon / publishable) بس.', 1);
      try { const pl = JSON.parse(atob(k.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); if (pl.role === 'service_role') return toast('ده مفتاح service_role السري. استخدم المفتاح anon بس.', 1); } catch (e) {}
      SB_URL = u; SB_KEY = k;
      try { localStorage.setItem('carexit_cfg', JSON.stringify({u, k})); } catch (e) { toast('الجهاز مش بيحفظ الإعدادات، هتحتاج تلصقهم كل مرة', 1); }
      boot();
    },
    resetcfg: () => { e.preventDefault(); try { localStorage.removeItem('carexit_cfg'); } catch (x) {} SB_URL = 'PASTE_SUPABASE_URL'; SB_KEY = 'PASTE_ANON_KEY'; me = null; render(); },
    showpw: () => { const i = $('#pw'), s = i.type === 'password'; i.type = s ? 'text' : 'password'; b.textContent = s ? 'إخفاء' : 'إظهار'; },
    login: () => run(async () => { const {error} = await sb.auth.signInWithPassword({email: $('#em').value.trim(), password: $('#pw').value}); if (error) throw error; }),
    signup: () => run(async () => { const {data, error} = await sb.auth.signUp({email: $('#em').value.trim(), password: $('#pw').value}); if (error) throw error; if (!data.session) toast('اتبعت إيميل تأكيد. أكّد الإيميل وبعدها ادخل.'); }),
    logout: () => run(async () => { await sb.auth.signOut(); }),
    tab: () => { tab = id; render(); },
    quote: () => run(async () => {
      const q = await rpc('quote', {p_center: v('c')}), fee = q.fee;
      byId('q-' + id).innerHTML = `<div class="box"><div class="row"><span>سعر الفحص</span><span>${M(fee)}</span></div><div class="row"><span>عمولة المنصة</span><span>${M(q.commission)}</span></div>
        <div class="row"><span>هتحوّل</span><span class="big">${M(q.per_party)}</span></div><div class="row"><span>إجمالي المحصّل من الطرفين</span><span>${M(q.total)}</span></div>
        <div class="mu" style="margin-top:6px">لو العربية مطابقة لإفصاحات البائع: بتتحمل ${M(q.per_party)} والبائع يترد له ${M(fee)}.<br>لو ثبتت مخالفة جوهرية: البائع يتحمل وبيترد لك ${M(fee)}.<br>لو غير حاسم أو نزاع: مراجعة من الأدمن.</div>
        <button class="p" data-a="req" data-id="${id}">أوافق على السياسة وأطلب الفحص</button></div>`;
    }),
    req: () => run(async () => { await rpc('create_request', {p_listing: id, p_center: v('c')}); tab = 'mine'; }, 'تم تسجيل الطلب. مساهمتك اتسجلت (محاكاة).'),
    accept: () => run(() => rpc('accept_request', {p_id: id}), 'تمت الموافقة وتسجيل مساهمتك (محاكاة).'),
    report: () => run(async () => {
      const f = (v('fd') || '').split('\n').map(x => x.trim()).filter(Boolean).map(x => { const m = x.match(/^(info|minor|moderate|major|critical)\|(.+)$/); return m ? {severity: m[1], description: m[2].trim()} : {severity: 'minor', description: x}; });
      await rpc('submit_report', {p_id: id, p_vehicle: v('vh'), p_center: v('cn'), p_limits: v('lm') || null, p_findings: f});
    }, 'تم رفع التقرير.'),
    resp: () => run(async () => {
      let reason = null; if (b.dataset.v === 'disputed') { reason = prompt('سبب الاعتراض (10 حروف على الأقل)'); if (!reason) return; }
      await rpc('respond_report', {p_id: id, p_resp: b.dataset.v, p_reason: reason});
    }, 'تم تسجيل ردك.'),
    review: () => run(() => rpc('admin_review', {
      p_id: id, p_outcome: v('o'), p_note: v('n'), p_item: v('it') || null, p_finding: v('fi') || null,
      p_evidence: (v('ev') || '').split(',').map(x => x.trim()).filter(Boolean), p_attest: byId('at-' + id).checked,
      p_decision: v('dc') || null, p_pct: v('dc') === 'split' ? +v('pc') : null}), 'تم حساب التسوية.'),
    settle: () => run(() => rpc('admin_settle', {p_id: id, p_action: b.dataset.v}), 'تم.'),
    rmph: () => { PH.splice(+id, 1); drawPv(); },
    newl: () => run(async () => {
      const g = x => (byId(x)?.value || '').trim(), make = g('d-make'), year = g('d-year');
      const t = g('nt') || [make, year].filter(Boolean).join(' ');
      if (!t) throw new Error('اكتب عنوان الإعلان أو الماركة والموديل');
      const items = [];
      for (const [k, label, ty] of Q) {
        const a = g('a-' + k), d = g('x-' + k);
        if (ty === 't') { if (a) items.push({category: k, statement: a}); continue; }
        if (!a) { if (ty === 'y') throw new Error('جاوب على: ' + label + ' (لو مش متأكد اختار غير متأكد)'); continue; }
        items.push({category: k, statement: a + (d ? ' — ' + d : ''), known: ty === 'y' && a === 'نعم'});
      }
      const price = g('d-price') ? Math.round(+g('d-price')) : null;
      if (price !== null && !(price >= 0)) throw new Error('السعر غير صالح');
      const lid = await rpc('create_listing', {p_title: t, p_items: items, p_price: price,
        p_details: {make, year, color: g('d-color'), fuel: g('d-fuel'), gearbox: g('d-gear'), chassis: g('d-chassis')}});
      let fail = 0;
      for (let i = 0; i < PH.length; i++) {
        const path = `${me.id}/${lid}/${i}.jpg`, up = await sb.storage.from('listing-photos').upload(path, PH[i].b, {contentType: 'image/jpeg'});
        if (up.error) { fail++; continue; }
        if ((await sb.from('listing_photos').insert({listing_id: lid, path, position: i})).error) fail++;
      }
      PH = []; tab = 'market';
      toast(fail ? `الإعلان اتنشر، بس ${fail} صورة فشلت` : 'تم نشر الإعلان.', !!fail);
    })
  };
  H[a]?.();
});
boot();
</script>
</body>
</html>
